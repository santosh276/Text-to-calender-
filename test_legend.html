<html>

        <span class="text-xs font-bold tracking-wide text-gray-700">NEUTRAL</span>
    </div>
    <div class="flex items-center gap-2 px-2">
        <div class="w-2.5 h-2.5 rounded-full bg-red-500 shadow-sm"></div>
        <span class="text-xs font-bold tracking-wide text-gray-700">BAD</span>
    </div>
</div>
