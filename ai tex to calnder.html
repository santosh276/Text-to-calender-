<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Precision Vaidik Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .ekadashi-bg { background-color: #fff7ed; border-color: #fb923c; }
        .purnima-bg { background-color: #f0f9ff; border-color: #38bdf8; }
        .amavasya-bg { background-color: #f8fafc; border-color: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 p-4">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm">
            <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-lg">← Previous</button>
            <h1 id="monthYearLabel" class="text-xl font-bold text-slate-800"></h1>
            <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-lg">Next →</button>
        </div>

        <div id="calendarGrid" class="grid grid-cols-7 gap-2">
            <div class="text-center font-semibold text-slate-500 py-2">Sun</div>
            <div class="text-center font-semibold text-slate-500 py-2">Mon</div>
            <div class="text-center font-semibold text-slate-500 py-2">Tue</div>
            <div class="text-center font-semibold text-slate-500 py-2">Wed</div>
            <div class="text-center font-semibold text-slate-500 py-2">Thu</div>
            <div class="text-center font-semibold text-slate-500 py-2">Fri</div>
            <div class="text-center font-semibold text-slate-500 py-2">Sat</div>
        </div>
    </div>

    <script>
        /* --- HIGH-PRECISION DRIK SIDDHANTA ENGINE --- */
        const VedicAstro = (function() {
            const D2R = Math.PI / 180;
            const norm = (d) => ((d % 360) + 360) % 360;

            function getPositions(jd) {
                const T = (jd - 2451545.0) / 36525;
                
                // Solar Position (Earth's Orbit)
                const L0 = norm(280.466 + 36000.77 * T);
                const M = norm(357.529 + 35999.05 * T);
                const sunLong = norm(L0 + 1.915 * Math.sin(M * D2R));
                
                // Lunar Position with 3 Key Corrections:
                // 1. Center: The basic oval path.
                // 2. Evection: The Sun's pull on the Moon (Crucial for 2026).
                // 3. Variation: Change in speed due to Sun's gravity.
                const Lp = norm(218.316 + 481267.881 * T);
                const D = norm(297.85 + 445267.11 * T);
                const Mm = norm(134.963 + 477198.867 * T);
                
                let moonLong = Lp + 6.289 * Math.sin(Mm * D2R)
                                 - 1.274 * Math.sin((Mm - 2 * D) * D2R) // Evection
                                 + 0.658 * Math.sin(2 * D * D2R);        // Variation

                const aya = 23.856 + 1.396 * T; // Lahiri Ayanamsa
                return { sun: norm(sunLong - aya), moon: norm(moonLong - aya) };
            }

            return {
                getSunriseTithi: function(date) {
                    const d = new Date(date);
                    // Standard Sunrise at 6:00 AM local time
                    d.setHours(6, 0, 0, 0);
                    const jd = (d.getTime() / 86400000) + 2440587.5;
                    const pos = getPositions(jd);
                    const diff = norm(pos.moon - pos.sun + 0.001);
                    return Math.floor(diff / 12);
                }
            };
        })();

        let currentViewDate = new Date(2026, 4, 1); // Start at May 2026 for testing

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const label = document.getElementById('monthYearLabel');
            
            // Clean grid except headers
            const headers = Array.from(grid.children).slice(0, 7);
            grid.innerHTML = '';
            headers.forEach(h => grid.appendChild(h));

            const year = currentViewDate.getFullYear();
            const month = currentViewDate.getMonth();
            label.innerText = currentViewDate.toLocaleString('default', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Fill empty days
            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));
            }

            // Generate Month Days
            for (let day = 1; day <= daysInMonth; day++) {
                const today = new Date(year, month, day);
                const yesterday = new Date(year, month, day - 1);

                const tithi = VedicAstro.getSunriseTithi(today);
                const tithiYesterday = VedicAstro.getSunriseTithi(yesterday);

                let label = "";
                let bgClass = "bg-white";

                // Udaya Tithi Check: Only label the first sunrise it appears
                if ((tithi === 10 || tithi === 25) && tithi !== tithiYesterday) {
                    label = "Ekadashi";
                    bgClass = "ekadashi-bg border-2";
                } else if (tithi === 14 && tithi !== tithiYesterday) {
                    label = "Purnima";
                    bgClass = "purnima-bg border-2";
                } else if (tithi === 29 && tithi !== tithiYesterday) {
                    label = "Amavasya";
                    bgClass = "amavasya-bg border-2";
                }

                const cell = document.createElement('div');
                cell.className = `${bgClass} p-3 rounded-lg shadow-sm min-h-[80px] border border-slate-100`;
                cell.innerHTML = `
                    <div class="text-sm font-bold text-slate-800">${day}</div>
                    <div class="text-[10px] text-slate-400 mt-1">Tithi ${tithi + 1}</div>
                    ${label ? `<div class="mt-2 text-[11px] font-bold text-orange-600 uppercase tracking-wider">${label}</div>` : ''}
                `;
                grid.appendChild(cell);
            }
        }

        function changeMonth(dir) {
            currentViewDate.setMonth(currentViewDate.getMonth() + dir);
            renderCalendar();
        }

        renderCalendar();
    </script>
</body>
</html>
