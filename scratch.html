<!DOCTYPE html>
<html>
<head>
<style>
body { background: #B91C1C; padding: 100px; display: flex; justify-content: center; }
.coin-wrapper {
    position: relative;
    z-index: 10;
    /* Tells the device to prepare for movement, making it instantly smooth */
    will-change: transform;
    animation: float-gentle 3s ease-in-out infinite;
}

.coin {
    width: 3rem;
    height: 3rem;
    border-radius: 50%;
    background: linear-gradient(135deg, #FCD34D 0%, #D97706 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid rgba(255, 255, 255, 0.2);
    box-shadow:
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        inset 0 2px 4px rgba(255, 255, 255, 0.3);
    position: relative;
    z-index: 20;
    /* Pushes the coin to its own graphic layer for faster loading */
    transform: translateZ(0);
}

.om-symbol {
    color: #B91C1C;
    width: 2.2rem;
    height: 2.2rem;
    filter: drop-shadow(0 2px 4px rgba(185, 28, 28, 0.3));
    animation: om-breathe 3s ease-in-out infinite;
    will-change: transform;
}

@keyframes float-gentle {
    0%, 100% { transform: translateY(0) translateZ(0); }
    50% { transform: translateY(-8px) translateZ(0); }
}

@keyframes om-breathe {
    0%, 100% { transform: scale(1) translateZ(0); }
    50% { transform: scale(1.15) translateZ(0); }
}

.ripple-effect::before,
.ripple-effect::after {
    content: '';
    position: absolute;
    /* Stretching to the edges instead of using a fixed width/height */
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 50%;
    z-index: -1;
    pointer-events: none;
    will-change: transform, opacity;
}

/* Layer 1: Soft Golden Glow */
.ripple-effect::before {
    background: radial-gradient(circle, rgba(252, 211, 77, 0.4) 0%, rgba(252, 211, 77, 0) 70%);
    animation: ripple-aura 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
}

/* Layer 2: Sharp Energy Ring */
.ripple-effect::after {
    border: 2px solid rgba(255, 255, 255, 0.8);
    animation: ripple-wave 2s ease-out infinite;
    animation-delay: 0.6s;
}

@keyframes ripple-aura {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(3); opacity: 0; }
}

@keyframes ripple-wave {
    0% { transform: scale(0.9); opacity: 0.9; }
    100% { transform: scale(2); opacity: 0; }
}
</style>
</head>
<body>
<div class="coin-wrapper ripple-effect">
    <div class="coin">
        <svg class="om-symbol" viewBox="0 0 100 100"><text x="50" y="50" dominant-baseline="middle" text-anchor="middle" font-size="60">ॐ</text></svg>
    </div>
</div>
</body>
</html>
