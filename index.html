<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline ML App</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px 0; cursor: pointer; }
        #status { margin-top: 10px; font-weight: bold; }
        .box { width: 100px; height: 100px; background: #3498db; animation: spin 2s linear infinite; margin: 20px 0; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #results { margin-top: 20px; border: 1px solid #ccc; padding: 10px; min-height: 50px; background: #f9f9f9; }
    </style>
    <!-- Include localForage to read from IndexedDB on the main thread -->
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
</head>
<body>
    <h1>Offline-First ML Embeddings</h1>
    <p>This spinning box proves the main thread remains lag-free while processing:</p>
    <div class="box"></div>

    <button id="start-btn">Fetch Data & Create Embeddings</button>
    <div id="status">Status: Waiting to start...</div>

    <h3>Results (Read from IndexedDB)</h3>
    <pre id="results">No data yet.</pre>

    <script src="app.js"></script>
</body>
</html>
